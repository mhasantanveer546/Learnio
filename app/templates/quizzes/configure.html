{% extends "base.html" %}

{% block title %}Create Quiz | Learnio{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    
    <!-- Page Header with History Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 fw-bold">Create a Quiz</h1>
            <p class="text-muted mb-0">Source Material: <span class="fw-semibold text-dark">{{ material.original_name }}</span></p>
        </div>
        <a href="{{ url_for('quizzes.quiz_history', material_id=material.id) }}" class="btn btn-outline-secondary btn-pill shadow-sm px-3">
            <i class="fas fa-clock-rotate-left me-2"></i> View History
        </a>
    </div>

    <!-- Centered Configuration Card -->
    <div class="d-flex justify-content-center">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="max-width: 500px; width: 100%;">
            <h4 class="fw-semibold mb-4">Quiz Configuration</h4>

            <form method="POST" action="{{ url_for('quizzes.generate_quiz_route', material_id=material.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Number of Questions -->
                <div class="mb-4">
                    <label class="form-label text-muted text-uppercase text-sm fw-bold mb-2">Number of Questions</label>
                    <select name="num_questions" class="form-select form-select-lg border-0 bg-light rounded-3">
                        <option value="5">5 Questions</option>
                        <option value="10" selected>10 Questions</option>
                        <option value="15">15 Questions</option>
                        <option value="20">20 Questions</option>
                    </select>
                </div>

                <!-- Question Types (Using Toggle Switches for modern UI) -->
                <div class="mb-4">
                    <label class="form-label text-muted text-uppercase text-sm fw-bold mb-2 d-block">Question Types</label>
                    <div class="d-flex flex-wrap gap-4 mt-2">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="question_types" value="mcq" id="type-mcq" checked>
                            <label class="form-check-label" for="type-mcq">Multiple Choice</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="question_types" value="true_false" id="type-tf" checked>
                            <label class="form-check-label" for="type-tf">True / False</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="question_types" value="short" id="type-short">
                            <label class="form-check-label" for="type-short">Short Answer</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="question_types" value="long" id="type-long">
                            <label class="form-check-label" for="type-long">Long Answer</label>
                        </div>
                    </div>
                </div>

                <!-- Difficulty -->
                <div class="mb-4">
                    <label class="form-label text-muted text-uppercase text-sm fw-bold mb-2">Difficulty</label>
                    <select name="difficulty" class="form-select form-select-lg border-0 bg-light rounded-3">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-pill w-100 py-2-5 mt-2 fw-semibold shadow-sm" style="padding-top: 0.6rem; padding-bottom: 0.6rem;">
                    <i class="fas fa-wand-magic-sparkles me-2"></i> Generate Quiz
                </button>
            </form>
        </div>
    </div>
    
</div>
{% endblock %}
