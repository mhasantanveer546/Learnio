{% extends "base.html" %}
{% block title %}Create Quiz{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card border-0 shadow-sm p-4" style="max-width: 480px; width: 100%;">
        <h4 class="fw-semibold mb-1">Create a Quiz</h4>
        <p class="text-muted mb-3">{{ material.original_name }}</p>

        <form method="POST" action="{{ url_for('quizzes.generate_quiz_route', material_id=material.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Number of Questions</label>
                <select name="num_questions" class="form-select">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Question Types</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="question_types" value="mcq" id="type-mcq" checked>
                    <label class="form-check-label" for="type-mcq">Multiple Choice</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="question_types" value="true_false" id="type-tf" checked>
                    <label class="form-check-label" for="type-tf">True / False</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="question_types" value="short" id="type-short">
                    <label class="form-check-label" for="type-short">Short Answer</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="question_types" value="long" id="type-long">
                    <label class="form-check-label" for="type-long">Long Answer</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                    <option value="mixed">Mixed</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Generate Quiz</button>
        </form>
    </div>
</div>
{% endblock %}
