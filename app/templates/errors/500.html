{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
     <h1 class="error-code" style="font-size: 6rem; font-weight: 800; color: var(--danger); margin-bottom: 16px;">500</h1>
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 8px;">Internal Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 32px;">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
