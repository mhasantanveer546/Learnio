{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <h1 style="font-size: 6rem; font-weight: 800; color: var(--primary); margin-bottom: 16px;">404</h1>
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 8px;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 32px;">Oops! The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
