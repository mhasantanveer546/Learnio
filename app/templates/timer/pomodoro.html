{% extends "base.html" %}
{% block title %}Study Timer{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card border-0 shadow-sm p-5 text-center" style="max-width: 420px; width: 100%;">
        <h4 class="fw-semibold mb-1" id="timer-mode-label">Focus Session</h4>
        <p class="text-muted small mb-4">25 minutes focus, 5 minutes break</p>

        <div class="display-1 fw-bold mb-4" id="timer-display" style="color: #2563EB;">25:00</div>

        <div class="mb-4">
            <label class="form-label small">Subject (optional)</label>
            <select id="timer-subject" class="form-select">
                <option value="">General Study</option>
                {% for subject in subjects %}
                <option value="{{ subject.id }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex gap-2 justify-content-center">
            <button id="timer-start" class="btn btn-primary px-4">Start</button>
            <button id="timer-stop" class="btn btn-outline-danger px-4 d-none">Stop</button>
        </div>

        <p class="text-muted small mt-4 mb-0" id="timer-status"></p>
    </div>
</div>
{% endblock %}
