<div class="dropdown" style="position: relative;">
    <button class="icon-btn" id="notif-bell-btn">
        <i class="fas fa-bell"></i>
        <span id="notif-badge" class="notification-dot" style="display:none;"></span>
    </button>
    <div class="dropdown-menu" id="notif-dropdown-menu" style="display:none; position:absolute; right:0; top:50px; width:320px; background:white; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); border:1px solid var(--border-color); z-index:1000;">
        <div style="padding:16px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
            <h4 style="margin:0; font-size:1rem;">Notifications</h4>
            <button id="notif-mark-all-read" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Mark all read</button>
        </div>
        <div id="notif-list" style="max-height:300px; overflow-y:auto;">
            <div style="padding:32px; text-align:center; color:var(--text-muted);">Loading...</div>
        </div>
    </div>
</div>
<script>
document.getElementById('notif-bell-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    const menu = document.getElementById('notif-dropdown-menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', function() {
    document.getElementById('notif-dropdown-menu').style.display = 'none';
});
</script>
