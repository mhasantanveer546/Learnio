<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container-fluid">
        <span class="navbar-brand fw-semibold">Learnio</span>

        {% if current_user.is_authenticated %}
        <form action="{{ url_for('search.search_results') }}" method="GET" class="mx-auto position-relative" style="max-width: 400px; width: 100%;" id="global-search-form">
            <input type="text" name="q" id="global-search-input" class="form-control form-control-sm" placeholder="Search everything..." autocomplete="off" value="{{ request.args.get('q', '') }}">
            <div id="search-live-results" class="position-absolute bg-white shadow-sm rounded mt-1 w-100 d-none" style="z-index: 1000; max-height: 350px; overflow-y: auto;"></div>
        </form>
        {% endif %}

        <div class="d-flex align-items-center ms-auto">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile.view_profile') }}" class="me-3 text-muted small text-decoration-none">
                    {{ current_user.username }}
                </a>
                <a id="logout-link" href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-secondary">
                    Log Out
                </a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn btn-sm btn-outline-primary me-2">
                    Log In
                </a>
                <a href="{{ url_for('auth.register') }}" class="btn btn-sm btn-primary">
                    Sign Up
                </a>
            {% endif %}
        </div>
    </div>
</nav>

{% if current_user.is_authenticated %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endif %}
