<header class="topnav">
    <div class="topnav-search">
        <i class="fas fa-search"></i>
        <form action="{{ url_for('search.search_results') }}" method="GET" id="global-search-form" style="position: relative;">
            <input type="text" name="q" id="global-search-input" placeholder="Search subjects, materials..." value="{{ request.args.get('q', '') }}" autocomplete="off">
            <div id="search-live-results" style="display:none; position:absolute; top:44px; left:0; width:100%; background:white; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.1); max-height:350px; overflow-y:auto; z-index:1000;"></div>
        </form>
    </div>
    <div class="topnav-actions">
        {% include 'components/notifications_dropdown.html' %}
        <div class="user-profile">
            <img src="{% if current_user.profile_picture_key %}{{ url_for('profile.serve_profile_picture', user_id=current_user.id) }}{% else %}https://ui-avatars.com/api/?name={{ current_user.username }}&background=7c3aed&color=fff{% endif %}" alt="Avatar">
            <div class="user-info">
                <h4>{{ current_user.username }}</h4>
                <p>{{ current_user.email }}</p>
            </div>
        </div>
    </div>
</header>
